<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¡Pago Completado! - Print2Web</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--white);
      background-image: radial-gradient(rgba(0, 0, 0, 0.04) 1.2px, transparent 1.2px);
      background-size: 16px 16px;
      margin: 0;
      font-family: var(--font);
    }
    .status-card {
      background: var(--white);
      padding: 3.5rem 3rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.03);
      max-width: 480px;
      width: 90%;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .status-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--yellow));
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .success-svg-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(23, 183, 232, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }
    .success-svg {
      width: 46px;
      height: 46px;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.8s 0.2s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    h2 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--black);
      letter-spacing: -0.02em;
    }
    
    .status-desc {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--gray-600);
      margin-bottom: 2rem;
    }
    
    .status-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gray-50);
      padding: 10px 16px;
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--gray-500);
      font-weight: 600;
      margin-bottom: 2.5rem;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background: var(--black);
      color: var(--white);
      font-weight: 700;
      font-size: 1rem;
      border-radius: 100px;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-return:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="status-card">
    <div class="success-svg-wrap">
      <svg class="success-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2>¡Pago Completado!</h2>
    <p class="status-desc">Hemos recibido tu pedido correctamente y ya está en nuestro sistema. En breve comenzaremos con el proceso de impresión.</p>
    
    <div class="status-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      El administrador ha sido notificado
    </div>

    <div>
      <a href="index.html" class="btn-return">Volver al inicio</a>
    </div>
  </div>
</body>
</html>
